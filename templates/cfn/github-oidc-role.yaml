AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM role assumable by a GitHub Actions workflow via OIDC (no long-lived AWS
  keys stored in GitHub), scoped to exactly one permission: trigger the SSM
  RunCommand deploy against exactly one instance. Same least-privilege shape
  as pipeline.yaml's DeployServiceRole — this is the GitHub-Actions-CI
  equivalent of that role. See references/github-oidc-setup.md for the
  renamed-repo/owner "sub" claim edge case before debugging a trust-policy
  AccessDenied.

Parameters:
  AppName:
    Type: String
    AllowedPattern: '[a-z0-9-]+'
  GitHubOwner:
    Type: String
  GitHubRepo:
    Type: String
  GitHubBranch:
    Type: String
    Default: main
  InstanceId:
    Type: AWS::EC2::Instance::Id
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      The GitHub OIDC provider is one-per-AWS-account, not one-per-app — set
      to 'false' and fill in ExistingOidcProviderArn if a prior run of this
      skill (for a different app) already created it in this account.
  ExistingOidcProviderArn:
    Type: String
    Default: ''
    Description: Only used when CreateOidcProvider=false.

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GithubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS auto-verifies GitHub's certificate chain as of 2022; this
      # thumbprint is GitHub's well-known root CA value, required by the
      # resource schema even though AWS no longer strictly needs it.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-github-actions-deploy-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [ShouldCreateProvider, !Ref GithubOidcProvider, !Ref ExistingOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': 'sts.amazonaws.com'
              StringLike:
                # Plain org/repo pattern — covers the common case. If this
                # repo or its owner was ever renamed, GitHub's sub claim
                # gains an immutable-ID suffix (repo:org@id/repo@id:ref:...)
                # and this condition will reject every run with a generic
                # AccessDenied; see references/github-oidc-setup.md.
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: ssm-deploy-trigger
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SendDeployCommand
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript'
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}'
              - Sid: ReadCommandResult
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  OidcProviderArn:
    Value: !If [ShouldCreateProvider, !Ref GithubOidcProvider, !Ref ExistingOidcProviderArn]
