AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Bare compute for hosting one or more Node apps behind nginx — this
  template owns only actual AWS resource properties (instance, security
  group, IAM role, EBS volume, alarms, Elastic IP). It does NOT install
  anything on the box: nvm/Node, pm2, nginx, certbot, AWS CLI v2, swap,
  the CloudWatch Agent, optional local Postgres/Redis/Docker, and the two
  shared /usr/local/bin/app-pipeline-deploy.sh /
  app-pipeline-rollback.sh scripts are all installed afterward, over SSM
  RunCommand, by templates/app/scripts/server-bootstrap.sh.tmpl (SKILL.md
  Step 4b) — deliberately not CloudFormation UserData, since UserData only
  runs once at creation and can't be safely retried after a resize or
  re-run against an existing instance. See references/server-bootstrap.md
  for the full reasoning. CI (CodePipeline or GitHub Actions) triggers the
  deploy script over SSM RunCommand instead of a real CodeDeploy agent
  (see references/gotchas.md for why).

Parameters:
  AppName:
    Type: String
    Description: >-
      Short identifier for tagging, e.g. my-api. Multiple apps may share one
      instance. Pick a globally-unique slug across every engagement this
      skill is ever used for (e.g. prefix with a client/project name,
      acme-api not api) — every stack, IAM role, and S3 bucket this skill
      creates is named from this value alone, so two unrelated apps
      choosing the same short name will collide. SKILL.md Step 3 checks for
      an existing stack under this name before creating anything, as a
      backstop, but a unique name up front avoids the check ever firing.
    AllowedPattern: '[a-z0-9-]+'
  InstanceType:
    Type: String
    Default: t3.micro
    Description: t3.micro (~908MB RAM) needs the swap file (set up by server-bootstrap.sh.tmpl) plus the NODE_OPTIONS heap cap (set in after_install.backend.sh.tmpl) to survive a Node build — fine for small apps, size up for anything heavier. Always ask the user explicitly rather than defaulting silently. See references/server-bootstrap.md for what happens if this turns out to be too small (resize is always a question, never automatic).
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Resolved at deploy time via the Canonical-maintained SSM public parameter — always the current Ubuntu 24.04 LTS AMI, never a stale hardcoded ID.
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Must be a public subnet (auto-assigns a public IP; the Elastic IP below also needs a public subnet to associate against).
  KeyName:
    Type: String
    Default: ''
    Description: Optional EC2 key pair name for break-glass SSH access. Leave blank to rely on SSM Session Manager only (recommended — no open SSH key to manage).
  SshCidr:
    Type: String
    Default: ''
    Description: CIDR allowed to reach port 22, e.g. 203.0.113.4/32 (your office/VPN IP). Leave blank to not open port 22 at all (recommended — SSM Session Manager needs no inbound port). Never defaults to 0.0.0.0/0.
  RootVolumeSize:
    Type: Number
    Default: 20
    Description: GiB. The default 8GB Ubuntu root volume fills up fast under repeated npm/build churn.
  NotificationTopicArn:
    Type: String
    Default: ''
    Description: SNS topic ARN from templates/cfn/notifications.yaml, used as the action for the disk-space and status-check alarms below. Leave blank to create the alarms without any action (still visible in the CloudWatch console).
  BackupBucketArn:
    Type: String
    Default: ''
    Description: S3 bucket ARN from templates/cfn/db-backup.yaml, if automated database backups were requested. Leave blank to skip. Grants this instance's role s3:PutObject on that bucket only — no read/list/delete — see references/db-backups.md.
  AssignElasticIp:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Always ask explicitly, never assume — a stable Elastic IP is effectively required if a domain will ever point at this instance (the default dynamic public IP changes on stop/start, silently breaking DNS). 'false' relies on the subnet's auto-assigned public IP instead — fine for a short-lived/throwaway instance with no domain, one fewer resource to account for.

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]
  HasSshCidr: !Not [!Equals [!Ref SshCidr, '']]
  HasNotificationTopic: !Not [!Equals [!Ref NotificationTopicArn, '']]
  HasBackupBucket: !Not [!Equals [!Ref BackupBucketArn, '']]
  ShouldAssignElasticIp: !Equals [!Ref AssignElasticIp, 'true']

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${AppName} app host — HTTP/HTTPS, SSH only if a CIDR was given'
      VpcId: !Ref VpcId
      # Deliberately never add a rule for the app's own port (3000/3001/etc.)
      # or a database port (5432/6379) here, even for "just debugging" —
      # traffic to the app always goes through nginx's 80/443 reverse proxy,
      # and a database is reached over localhost (same box) or the app's own
      # SG (RDS, see rds-instance.yaml's AppInstanceSecurityGroupId param),
      # never directly from the internet. A real, unrelated production
      # incident involved a box with exactly this SG mistake (app + Postgres
      # ports opened straight to 0.0.0.0/0, bypassing nginx and pg_hba
      # entirely) under active brute force — see references/secure-defaults.md.
      SecurityGroupIngress:
        - !If
          - HasSshCidr
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: !Ref SshCidr
          - !Ref 'AWS::NoValue'
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AppName}-sg'

  # ssm:GetParameter/PutParameter are scoped to this app's own namespace
  # only — mirrors the least-privilege pattern used for the pipeline's
  # DeployServiceRole. PutParameter is what lets the box push its own
  # .env to Parameter Store as a backup (Step 9 in SKILL.md) entirely
  # on-box, using its own file already on disk — no local temp file or
  # re-transmission of the secret needed anywhere else.
  # AmazonSSMManagedInstanceCore is required for SSM Session Manager /
  # RunCommand to reach this box at all (that's how the pipeline's Deploy
  # stage — and this skill's own bootstrap-verification step — talk to it,
  # with no SSH needed). CloudWatchAgentServerPolicy lets the CloudWatch
  # Agent installed below publish metrics/logs and read its own config.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-instance-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: app-parameter-store-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AppName}/*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # Separate AWS::IAM::Policy resource (rather than another entry in
  # InstanceRole's inline Policies list above) specifically so the whole
  # thing can be skipped via Condition when no backup bucket was requested
  # — a list entry can't be conditionally omitted the same way a resource
  # can. Write-only on purpose: the box can push backups but can't
  # list/read/delete existing ones, so a compromised instance can't use
  # this role to exfiltrate or wipe backup history (verified in practice —
  # `aws s3 cp` *from* the box correctly 403s under this policy).
  BackupBucketPolicy:
    Type: AWS::IAM::Policy
    Condition: HasBackupBucket
    Properties:
      PolicyName: db-backup-s3-put
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: s3:PutObject
            Resource: !Sub '${BackupBucketArn}/*'
      Roles:
        - !Ref InstanceRole

  # No CreationPolicy/cfn-signal, deliberately — this resource's own
  # readiness (EC2 status checks) is all CloudFormation needs to wait for.
  # `aws cloudformation deploy` returning is NOT "the box is ready to
  # bootstrap" — SKILL.md Step 4b polls SSM registration
  # (PingStatus: Online) separately before running
  # server-bootstrap.sh.tmpl over SSM RunCommand. See
  # references/server-bootstrap.md for the full reasoning.
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Ref AppName

  DiskSpaceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AppName}-disk-space-high'
      AlarmDescription: Root volume usage — the exact failure mode that already cost a debugging session once (see references/gotchas.md).
      Namespace: !Sub 'AppPipeline/${AppName}'
      MetricName: disk_used_percent
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance
        - Name: path
          Value: /
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasNotificationTopic, [!Ref NotificationTopicArn], []]

  StatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AppName}-status-check-failed'
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: !If [HasNotificationTopic, [!Ref NotificationTopicArn], []]

  ElasticIP:
    Type: AWS::EC2::EIP
    Condition: ShouldAssignElasticIp
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - Key: Name
          Value: !Sub '${AppName}-eip'

Outputs:
  InstanceId:
    Value: !Ref Instance
  # Use this one — it's always populated, with the stable Elastic IP if
  # AssignElasticIp=true, or the subnet's auto-assigned dynamic public IP
  # otherwise. Every other template/step that needs "the instance's public
  # IP" (dns-record.yaml, uptime-check.yaml, Step 9/10 in SKILL.md) reads
  # this output, not ElasticIp below.
  PublicIp:
    Value: !If [ShouldAssignElasticIp, !Ref ElasticIP, !GetAtt Instance.PublicIp]
  # Only present when AssignElasticIp=true — use PublicIp above for the
  # general case; this exists for when a caller specifically needs to know
  # whether the IP is guaranteed stable.
  ElasticIp:
    Condition: ShouldAssignElasticIp
    Value: !Ref ElasticIP
  SecurityGroupId:
    Value: !Ref SecurityGroup
