{
  "schema_version": "1.0",
  "name": "doctor-healthy",
  "description": "/tp:doctor runs the preflight over the bed: the script's checks pass or warn (never fail), the table is reported, and the result is written to _doctor.json.",
  "tags": [
    "smoke",
    "stage"
  ],
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "execution": {
    "prompt": "/tp:doctor inline=true",
    "max_turns": 25,
    "timeout_seconds": 420,
    "model": "sonnet",
    "allowed_tools": [
      "Bash",
      "Read",
      "Write",
      "Edit",
      "Grep",
      "Glob",
      "Skill"
    ]
  },
  "runs": 1,
  "graders": [
    {
      "type": "file_exists",
      "name": "the preflight is written",
      "path": ".claude/work/_doctor.json"
    },
    {
      "type": "regex",
      "name": "and nothing failed",
      "pattern": "\"ok\": true",
      "target": {
        "source": "file",
        "path": ".claude/work/_doctor.json"
      }
    },
    {
      "type": "regex",
      "name": "it checked the allowlist and the ceiling",
      "pattern": "\"name\": \"(allowlist|ceiling)\"",
      "target": {
        "source": "file",
        "path": ".claude/work/_doctor.json"
      }
    },
    {
      "type": "regex",
      "name": "and reported the one-line result",
      "pattern": "preflight: (ok|\\d+ warning)"
    },
    {
      "type": "tool_used",
      "name": "the script did the checks",
      "tool": "Bash",
      "input_match": "doctor\\.mjs"
    }
  ]
}
