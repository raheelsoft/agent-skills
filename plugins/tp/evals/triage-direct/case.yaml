{
  "schema_version": "1.0",
  "name": "triage-direct",
  "description": "/tp:triage decides a clear one-file bug is direct work and leaves triage.md and triage.json in the work directory \u2014 written without a person at the prompt: the document through the state script, the JSON through put.",
  "tags": [
    "smoke",
    "stage"
  ],
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "execution": {
    "prompt": "/tp:triage DEMO-4 inline=true",
    "max_turns": 30,
    "timeout_seconds": 420,
    "model": "sonnet",
    "allowed_tools": [
      "Bash",
      "Read",
      "Write",
      "Edit",
      "Grep",
      "Glob",
      "Skill"
    ]
  },
  "runs": 1,
  "graders": [
    {
      "type": "file_exists",
      "name": "triage.md is there",
      "path": ".claude/work/DEMO-4/triage.md"
    },
    {
      "type": "file_exists",
      "name": "triage.json is there",
      "path": ".claude/work/DEMO-4/triage.json"
    },
    {
      "type": "regex",
      "name": "and it decided direct work",
      "pattern": "\"decision\": \"direct\"",
      "target": {
        "source": "file",
        "path": ".claude/work/DEMO-4/triage.json"
      }
    },
    {
      "type": "regex",
      "name": "through put (the schema version is stamped)",
      "pattern": "\"schemaVersion\": 1",
      "target": {
        "source": "file",
        "path": ".claude/work/DEMO-4/triage.json"
      }
    },
    {
      "type": "regex",
      "name": "and logged the stage done",
      "pattern": "triage \u00b7 done",
      "target": {
        "source": "file",
        "path": ".claude/work/DEMO-4/progress.md"
      }
    },
    {
      "type": "tool_used",
      "name": "the state script wrote the document",
      "tool": "Bash",
      "input_match": "state\\.mjs doc"
    }
  ]
}
