{
  "schema_version": "1.0",
  "name": "status-one-ticket",
  "description": "/tp:status reads the work directory through the state script and reports the picked-up ticket and its next stage.",
  "tags": [
    "smoke"
  ],
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "execution": {
    "prompt": "/tp:status",
    "max_turns": 14,
    "timeout_seconds": 420,
    "model": "sonnet",
    "allowed_tools": [
      "Bash",
      "Read",
      "Skill"
    ]
  },
  "runs": 1,
  "graders": [
    {
      "type": "regex",
      "name": "names the ticket",
      "pattern": "DEMO-4"
    },
    {
      "type": "regex",
      "name": "says what is next",
      "pattern": "triage",
      "flags": "i"
    },
    {
      "type": "tool_used",
      "name": "asks the state script",
      "tool": "Bash",
      "input_match": "state\\.mjs"
    }
  ]
}
