name: Sync to Target Repository

# Fires on any push to main or dev — covers both direct pushes and merged PRs.
# Incrementally applies only new commits to the target repo with a rewritten author.
# A tracking ref (refs/target-sync/<branch>) in this repo marks the last synced commit.
on:
  push:
    branches:
      - main
      - dev
  # Lets a resync be triggered manually (e.g. after fixing a bug in this workflow, or recovering
  # from a bad target-repo state) without needing to delete the tracking ref and push a no-op
  # commit just to fire the "push" trigger.
  workflow_dispatch:

permissions:
  contents: write # required to update the tracking ref in this repo after each sync

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Read the tracking ref to find where we left off last time.
      # On first run this will be empty, triggering a full initial sync.
      - name: Read last synced commit
        id: last-sync
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          LAST=$(git ls-remote origin "refs/target-sync/$BRANCH" 2>/dev/null | awk '{print $1}')
          echo "commit=$LAST" >> $GITHUB_OUTPUT
          if [[ -z "$LAST" ]]; then
            echo "No tracking ref found — this will be the first sync (all commits)"
          else
            echo "Last synced commit: $LAST"
          fi

      # Collect commits that haven't been synced yet, in chronological order.
      #
      # --first-parent walks only the branch's own mainline — i.e. one entry per direct
      # commit plus one per merged-in PR (the merge commit itself), never the individual
      # commits that lived on a merged feature branch. That matters because a feature
      # branch forked before some other change landed carries stale content for any file
      # that change touched, for every one of its own commits, until the branch is
      # actually merged back. Replaying those commits individually — each contributing
      # its own full-file snapshot via `git show` — would apply that stale content to the
      # target repo and revert the earlier change, even though the branch's eventual
      # merge reconciles everything correctly. Following first-parent only replays the
      # reconciled tree at each mainline step, never an intermediate branch's stale one.
      - name: Collect new commits
        id: new-commits
        env:
          LAST_SYNCED: ${{ steps.last-sync.outputs.commit }}
        run: |
          if [[ -z "$LAST_SYNCED" ]]; then
            git log --reverse --first-parent --format="%H" HEAD > /tmp/new_commits.txt
          else
            git log --reverse --first-parent --format="%H" "$LAST_SYNCED..HEAD" > /tmp/new_commits.txt
          fi

          if [[ -s /tmp/new_commits.txt ]]; then
            COUNT=$(wc -l < /tmp/new_commits.txt | tr -d ' ')
            echo "has_commits=true" >> $GITHUB_OUTPUT
            echo "$COUNT new commit(s) to sync"
          else
            echo "has_commits=false" >> $GITHUB_OUTPUT
            echo "Nothing to sync — already up to date"
          fi

      # Authenticate via an SSH key tied to the target GitHub account.
      # The public key is registered under the target account's SSH keys
      # (github.com/settings/keys) — NOT as a repo deploy key — so it is
      # invisible from any repository's settings page.
      - name: Setup SSH for target repo
        if: steps.new-commits.outputs.has_commits == 'true'
        env:
          TARGET_SSH_KEY: ${{ secrets.TARGET_SSH_KEY }}
        run: |
          if [[ -z "$TARGET_SSH_KEY" ]]; then
            echo "ERROR: TARGET_SSH_KEY secret is not set." >&2
            echo "Go to Settings → Secrets and variables → Actions → Secrets and add your account-level SSH private key as TARGET_SSH_KEY." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$TARGET_SSH_KEY" > ~/.ssh/target_ssh_key
          chmod 600 ~/.ssh/target_ssh_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host github-target
            HostName github.com
            User git
            IdentityFile ~/.ssh/target_ssh_key
            IdentitiesOnly yes
          EOF

      # For each new commit:
      #   - get all changed files
      #   - filter out any matching TARGET_NOT_SYNC_PATHS (gitignore-style patterns)
      #   - skip the commit entirely if nothing remains after filtering
      #   - otherwise apply the surviving file changes to the target repo
      #     and commit with the target author identity + original timestamps
      - name: Apply new commits to target repo
        if: steps.new-commits.outputs.has_commits == 'true'
        env:
          TARGET_REPO_SSH_URL: ${{ secrets.TARGET_REPO_SSH_URL }}
          TARGET_AUTHOR_NAME: ${{ secrets.TARGET_AUTHOR_NAME }}
          TARGET_AUTHOR_EMAIL: ${{ secrets.TARGET_AUTHOR_EMAIL }}
          TARGET_NOT_SYNC_PATHS: ${{ vars.TARGET_NOT_SYNC_PATHS }}
          LAST_SYNCED: ${{ steps.last-sync.outputs.commit }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # ── Validate required secrets ─────────────────────────────────────────
          MISSING=()
          [[ -z "$TARGET_REPO_SSH_URL"  ]] && MISSING+=("TARGET_REPO_SSH_URL")
          [[ -z "$TARGET_AUTHOR_NAME"   ]] && MISSING+=("TARGET_AUTHOR_NAME")
          [[ -z "$TARGET_AUTHOR_EMAIL"  ]] && MISSING+=("TARGET_AUTHOR_EMAIL")
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "ERROR: The following required secrets are not set in this repository:" >&2
            printf '  - %s\n' "${MISSING[@]}" >&2
            echo "Go to Settings → Secrets and variables → Actions → Secrets and add them." >&2
            exit 1
          fi

          # ── Write exclusion patterns ──────────────────────────────────────────
          # Blank lines and comment lines are stripped so the matcher never sees them.
          printf '%s\n' "$TARGET_NOT_SYNC_PATHS" \
            | grep -v '^[[:space:]]*$' \
            | grep -v '^#' \
            > /tmp/sync_exclude_patterns

          if [[ -s /tmp/sync_exclude_patterns ]]; then
            echo "Exclusion patterns:"
            cat /tmp/sync_exclude_patterns
          else
            echo "No exclusion patterns — all files will be synced."
          fi

          # ── Pure-bash path matcher ────────────────────────────────────────────
          # No git subprocess, no empty-string errors.
          # Supports: exact names, directory prefixes (trailing /), globs (*, ?),
          # and path-relative patterns (containing /). Negation (!) is skipped safely.
          is_excluded() {
            local file="$1" pattern p base
            [[ -z "${file//[[:space:]]/}" ]] && return 1   # reject blank/whitespace paths

            while IFS= read -r pattern || [[ -n "$pattern" ]]; do
              pattern="${pattern%$'\r'}"                    # strip CR (CRLF safety)
              [[ -z "$pattern" || "$pattern" == \!* ]] && continue

              p="${pattern%/}"                              # strip trailing slash
              base="${file##*/}"                            # basename of file

              if [[ "$p" == */* ]]; then
                # Path-relative pattern (e.g. .github/workflows/sync.yml)
                # shellcheck disable=SC2254
                [[ "$file" == $p || "$file" == $p/* ]] && return 0
              else
                # Simple name or glob (e.g. *.secret, CLAUDE.md, private)
                # case gives free glob matching on the pattern without quoting tricks
                case "$base" in $p) return 0 ;; esac
                [[ "$file" == "$p" || "$file" == "$p/"* ]] && return 0
              fi
            done < /tmp/sync_exclude_patterns

            return 1
          }

          # ── Clone target repo ─────────────────────────────────────────────────
          # Rewrite the SSH URL to use the dedicated Host alias so the
          # correct key is selected even if other SSH keys are present.
          CLONE_URL="${TARGET_REPO_SSH_URL/github.com/github-target}"
          echo "Cloning target repo..."
          git clone "$CLONE_URL" /tmp/target-repo
          cd /tmp/target-repo
          git config user.name  "$TARGET_AUTHOR_NAME"
          git config user.email "$TARGET_AUTHOR_EMAIL"

          # ── Checkout or create target branch ──────────────────────────────────
          # Check whether the branch already exists on the remote.
          # Edge case: target repo may only have main when we're syncing dev.
          # Use -B (create-or-reset) rather than -b: `git clone` already auto-checks-out a local
          # branch matching the target repo's default branch (even on a fresh/empty repo, where
          # it leaves an unborn branch of that name) — if $BRANCH is that same name, a plain -b
          # collides with it ("a branch named '...' already exists"). -B handles both the fresh
          # empty repo and the already-has-commits repo case without erroring.
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            # Branch exists remotely — check it out locally with tracking.
            git checkout -B "$BRANCH" "origin/$BRANCH"
            echo "Checked out existing branch: $BRANCH"
          else
            # Branch does not exist yet — create it from the default branch HEAD.
            # The first push will create it on the remote automatically.
            git checkout -B "$BRANCH"
            echo "Branch '$BRANCH' does not exist in target repo yet — it will be created on push."
          fi

          cd "$GITHUB_WORKSPACE"

          SYNCED=0
          SKIPPED=0

          # Empty-tree object ID (git hash-object -t tree /dev/null) — used as the "parent"
          # for a root commit so it diffs as everything-added instead of erroring out.
          EMPTY_TREE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"

          while IFS= read -r COMMIT; do
            [[ -z "$COMMIT" ]] && continue

            # Diff explicitly against the first parent's tree (falling back to the empty
            # tree for a root commit) rather than the implicit single-commit form of
            # diff-tree. Plain `git diff-tree COMMIT` (no -m/-c) produces no diff at all
            # for a commit with more than one parent, so every merge commit — the exact
            # commit that reconciles a feature branch back into the mainline — was
            # silently treated as "no changes" and skipped. Diffing tree-to-tree against
            # the first parent works uniformly for regular, root, and merge commits, and
            # reflects the fully reconciled tree rather than assuming away merges.
            PARENT=$(git rev-parse -q --verify "$COMMIT^1" || echo "$EMPTY_TREE")

            # Get all changed files in this commit, then strip excluded ones.
            MODIFIED=""
            while IFS= read -r file; do
              [[ -z "${file//[[:space:]]/}" ]] && continue
              is_excluded "$file" || MODIFIED+="$file"$'\n'
            done < <(git diff-tree --no-commit-id -r --name-only --diff-filter=ACM "$PARENT" "$COMMIT")

            DELETED=""
            while IFS= read -r file; do
              [[ -z "${file//[[:space:]]/}" ]] && continue
              is_excluded "$file" || DELETED+="$file"$'\n'
            done < <(git diff-tree --no-commit-id -r --name-only --diff-filter=D "$PARENT" "$COMMIT")

            if [[ -z "$MODIFIED" && -z "$DELETED" ]]; then
              SKIPPED=$((SKIPPED + 1))
              echo "Skipped $COMMIT (all changed files match exclusion patterns)"
              continue
            fi

            # Copy added/modified files into the target repo working tree.
            while IFS= read -r file; do
              [[ -z "${file//[[:space:]]/}" ]] && continue
              mkdir -p "/tmp/target-repo/$(dirname "$file")"
              git show "$COMMIT:$file" > "/tmp/target-repo/$file"
            done <<< "$MODIFIED"

            # Remove deleted files from the target repo working tree.
            while IFS= read -r file; do
              [[ -z "${file//[[:space:]]/}" ]] && continue
              rm -f "/tmp/target-repo/$file"
            done <<< "$DELETED"

            # Capture commit metadata before switching directories.
            git log -1 --format="%B" "$COMMIT" > /tmp/commit_msg.txt
            AUTHOR_DATE=$(git log    -1 --format="%aI" "$COMMIT")
            COMMITTER_DATE=$(git log -1 --format="%cI" "$COMMIT")

            # Commit to the target repo with the target identity.
            # Original author/committer timestamps are preserved.
            cd /tmp/target-repo
            git add -A

            # Skip if the target repo already has these exact file contents
            # (e.g. a commit was manually applied to the target repo beforehand).
            if git diff --cached --quiet; then
              SKIPPED=$((SKIPPED + 1))
              echo "Skipped $COMMIT (no net change in target repo — already applied)"
              cd "$GITHUB_WORKSPACE"
              continue
            fi

            GIT_AUTHOR_NAME="$TARGET_AUTHOR_NAME"       \
            GIT_AUTHOR_EMAIL="$TARGET_AUTHOR_EMAIL"     \
            GIT_AUTHOR_DATE="$AUTHOR_DATE"              \
            GIT_COMMITTER_NAME="$TARGET_AUTHOR_NAME"    \
            GIT_COMMITTER_EMAIL="$TARGET_AUTHOR_EMAIL"  \
            GIT_COMMITTER_DATE="$COMMITTER_DATE"        \
            git commit -F /tmp/commit_msg.txt
            SYNCED=$((SYNCED + 1))

            cd "$GITHUB_WORKSPACE"
          done < /tmp/new_commits.txt

          echo "Done: $SYNCED commit(s) applied, $SKIPPED skipped"

          cd /tmp/target-repo
          git push origin "$BRANCH"

      # Move the tracking ref forward so the next run knows where to start.
      - name: Update sync tracking ref
        if: steps.new-commits.outputs.has_commits == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git push origin "HEAD:refs/target-sync/$BRANCH"
          echo "Tracking ref updated to $(git rev-parse HEAD)"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/target_ssh_key
